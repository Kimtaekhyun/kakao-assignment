<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimal Todo App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <header>
            <h1>투두 리스트</h1>
        </header>
        
        <div class="weekly-calendar">
            <div class="calendar-header">
                <button id="prev-week-btn" class="nav-btn">&lt;</button>
                <span id="current-month-display"></span>
                <button id="next-week-btn" class="nav-btn">&gt;</button>
            </div>
            <div class="week-days" id="week-days">
                </div>
        </div>
        
        <div class="input-container">
            <input type="text" id="todo-input" placeholder="할 일을 입력하세요..." autocomplete="off">
            <button id="add-button">추가</button>
        </div>

        <div class="filter-container">
            <button class="filter-btn active" data-filter="all">전체</button>
            <button class="filter-btn" data-filter="active">진행 중</button>
            <button class="filter-btn" data-filter="completed">완료</button>
        </div>

        <ul id="todo-list"></ul>
    </div>

    <script src="app.js" defer></script>
</body>
</html>
